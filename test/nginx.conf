load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_http_modsecurity_module.so;

events {}

http {
    brotli on;
    brotli_types text/plain;
    zstd on;
    zstd_types text/plain;
    modsecurity off;
    lua_shared_dict smoke 1m;

    init_by_lua_block {
        local function read(name)
            local f = assert(io.open("/test/" .. name))
            local s = f:read("*a")
            f:close()
            return s
        end
        local ssl = require "ngx.ssl"
        smoke_cert = assert(ssl.parse_pem_cert(read("lua.crt")))
        smoke_key = assert(ssl.parse_pem_priv_key(read("lua.key")))
    }

    upstream lua_backend {
        server 0.0.0.1;
        balancer_by_lua_block {
            local b = require "ngx.balancer"
            assert(b.set_more_tries(1))
            assert(b.set_current_peer("127.0.0.1", 8081))
        }
    }

    server {
        listen 8080;
        listen 8443 ssl;
        ssl_certificate /test/fallback.crt;
        ssl_certificate_key /test/fallback.key;
        ssl_certificate_by_lua_block {
            local ssl = require "ngx.ssl"
            if ssl.server_name() == "lua.test" then
                assert(ssl.clear_certs())
                assert(ssl.set_cert(smoke_cert))
                assert(ssl.set_priv_key(smoke_key))
            end
        }

        location / {
            default_type text/plain;
            content_by_lua_block {
                ngx.say(string.rep("edge ", 200))
            }
        }

        location = /libs {
            default_type text/plain;
            set_by_lua_block $ndk { return "ndk" }
            content_by_lua_block {
                for _, m in ipairs({"resty.core", "resty.lrucache", "resty.sha256", "resty.random", "resty.string", "cjson", "ngx.ssl", "ngx.balancer", "ngx.re"}) do
                    require(m)
                end
                local str = require "resty.string"
                local sha = require("resty.sha256"):new()
                sha:update("edge")
                ngx.shared.smoke:set("k", "v")
                ngx.say(ngx.var.ndk, " ", ngx.shared.smoke:get("k"), " ", require("cjson").encode({ok = true}), " ", str.to_hex(sha:final()):sub(1, 8))
            }
        }

        location = /balancer {
            proxy_pass http://lua_backend;
        }
    }

    server {
        listen 127.0.0.1:8081;
        location / {
            return 200 "backend\n";
        }
    }
}

stream {
    upstream lua_stream {
        server 0.0.0.1:1;
        balancer_by_lua_block {
            assert(require("ngx.balancer").set_current_peer("127.0.0.1", 8081))
        }
    }

    server {
        listen 9000;
        preread_by_lua_block {
            ngx.ctx.seen = true
        }
        proxy_pass lua_stream;
    }
}
