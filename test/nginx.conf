load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_http_modsecurity_module.so;

events {}

http {
    brotli on;
    brotli_types text/plain;
    zstd on;
    zstd_types text/plain;
    modsecurity off;
    lua_shared_dict smoke 1m;

    init_worker_by_lua_block {
        local smoke = ngx.shared.smoke
        assert(ngx.timer.every(0.05, function(premature)
            if not premature then
                smoke:incr("ticks", 1, 0)
            end
        end))
        assert(ngx.timer.at(0, function(premature)
            if not premature then
                smoke:set("once", ngx.worker.id() .. ":" .. ngx.worker.pid())
            end
        end))
    }

    init_by_lua_block {
        local function read(name)
            local f = assert(io.open("/test/" .. name))
            local s = f:read("*a")
            f:close()
            return s
        end
        local ssl = require "ngx.ssl"
        smoke_cert = assert(ssl.parse_pem_cert(read("lua.crt")))
        smoke_key = assert(ssl.parse_pem_priv_key(read("lua.key")))
    }

    upstream lua_backend {
        server 0.0.0.1;
        balancer_by_lua_block {
            local b = require "ngx.balancer"
            local state = b.get_last_failure()
            if state then
                ngx.ctx.failure = state
                assert(b.set_current_peer("127.0.0.1", 8081))
            else
                assert(b.set_more_tries(1))
                assert(b.set_current_peer("127.0.0.1", 8082))
            end
        }
    }

    server {
        listen 8080;
        listen 8443 ssl;
        listen 8443 quic reuseport;
        ssl_certificate /test/fallback.crt;
        ssl_certificate_key /test/fallback.key;
        ssl_certificate_by_lua_block {
            local ssl = require "ngx.ssl"
            if ssl.server_name() == "lua.test" then
                assert(ssl.clear_certs())
                assert(ssl.set_cert(smoke_cert))
                assert(ssl.set_priv_key(smoke_key))
            end
        }
        ssl_client_hello_by_lua_block {
            local ch = require "ngx.ssl.clienthello"
            local ffi = require "ffi"
            pcall(ffi.cdef, "unsigned int SSL_client_hello_get0_legacy_version(void *s);")
            local ciphers = assert(ch.get_client_hello_ciphers())
            local exts = assert(ch.get_client_hello_ext_present())
            local quic = false
            for _, e in ipairs(exts) do
                if e == 57 then
                    quic = true
                end
            end
            local legacy = tonumber(ffi.C.SSL_client_hello_get0_legacy_version(require("ngx.ssl").get_req_ssl_pointer()))
            local ok = #ciphers > 0 and ch.get_client_hello_ext(13) and ch.get_client_hello_ext(16) and ch.get_supported_versions() and legacy == 0x0303
            ngx.ctx.hello = (quic and "quic" or "tcp") .. (ok and " ok" or " bad")
        }

        location = /hello {
            default_type text/plain;
            content_by_lua_block {
                ngx.say(ngx.ctx.hello or "none")
            }
        }

        location / {
            default_type text/plain;
            content_by_lua_block {
                ngx.say(string.rep("edge ", 200))
            }
        }

        location = /libs {
            default_type text/plain;
            set_by_lua_block $ndk { return "ndk" }
            content_by_lua_block {
                for _, m in ipairs({"resty.core", "resty.lrucache", "resty.sha256", "resty.random", "resty.string", "cjson", "ngx.ssl", "ngx.balancer", "ngx.re"}) do
                    require(m)
                end
                local str = require "resty.string"
                local sha = require("resty.sha256"):new()
                sha:update("edge")
                ngx.shared.smoke:set("k", "v")
                ngx.say(ngx.var.ndk, " ", ngx.shared.smoke:get("k"), " ", require("cjson").encode({ok = true}), " ", str.to_hex(sha:final()):sub(1, 8))
            }
        }

        location = /balancer {
            proxy_pass http://lua_backend;
            header_filter_by_lua_block {
                ngx.header["X-Failure"] = ngx.ctx.failure or "none"
            }
            log_by_lua_block {
                ngx.shared.smoke:set("log", ngx.var.upstream_status .. " " .. (ngx.ctx.failure or "none"))
            }
        }

        location = /logged {
            default_type text/plain;
            content_by_lua_block {
                ngx.say(ngx.shared.smoke:get("log") or "nothing")
            }
        }

        location = /api {
            default_type text/plain;
            content_by_lua_block {
                local smoke = ngx.shared.smoke
                local failed = {}
                local function check(name, ok)
                    if not ok then
                        failed[#failed + 1] = name
                    end
                end
                local th = ngx.thread.spawn(function()
                    local sock = ngx.socket.tcp()
                    sock:settimeout(2000)
                    assert(sock:connect("127.0.0.1", 8081))
                    assert(sock:send("GET / HTTP/1.0\r\nHost: backend\r\n\r\n"))
                    local body = sock:receive("*a")
                    sock:close()
                    return body
                end)
                local ok, body = ngx.thread.wait(th)
                check("cosocket", ok and body and body:find("backend", 1, true))
                ngx.sleep(0.2)
                check("timer.every", (smoke:get("ticks") or 0) > 0)
                check("timer.at", smoke:get("once") == ngx.worker.id() .. ":" .. ngx.worker.pid())
                check("subsystem", ngx.config.subsystem == "http")
                check("base64", ngx.encode_base64("edge") == "ZWRnZQ==")
                check("crc32", type(ngx.crc32_long("edge")) == "number" and ngx.crc32_long("edge") == ngx.crc32_short("edge"))
                check("bit", require("bit").bxor(5, 3) == 6)
                check("cjson.safe", require("cjson.safe").decode("{") == nil)
                check("random", #require("resty.random").bytes(16) == 16)
                local lru = require("resty.lrucache").new(10)
                lru:set("a", 1)
                check("lrucache", lru:get("a") == 1)
                local m = ngx.re.match("edge-42", [[(\d+)$]], "jo")
                check("ngx.re", m and m[1] == "42")
                check("safe_add", smoke:safe_add("added", 1) and not smoke:safe_add("added", 2))
                check("safe_set", smoke:safe_set("safe", 1))
                check("incr", smoke:incr("n", 2, 1) == 3)
                smoke:set("short", 1, 0.001)
                ngx.sleep(0.01)
                smoke:flush_expired()
                check("expired", smoke:get("short") == nil)
                check("get_keys", #smoke:get_keys(0) > 0)
                smoke:delete("n")
                check("delete", smoke:get("n") == nil)
                check("time", ngx.now() >= ngx.time())
                if #failed > 0 then
                    ngx.status = 500
                    ngx.say("failed: ", table.concat(failed, " "))
                    return ngx.exit(ngx.HTTP_OK)
                end
                ngx.say("ok")
            }
        }

        location = /body {
            default_type text/plain;
            content_by_lua_block {
                ngx.req.read_body()
                ngx.say(ngx.req.get_method(), " ", ngx.req.get_body_data() or "")
            }
        }

        location = /deny {
            content_by_lua_block {
                ngx.req.discard_body()
                ngx.status = 403
                ngx.header.content_type = "text/plain"
                ngx.say("denied")
                return ngx.exit(ngx.HTTP_OK)
            }
        }

        location = /waf {
            default_type text/plain;
            modsecurity on;
            modsecurity_rules 'SecRuleEngine On';
            modsecurity_rules 'SecRule ARGS:x "@streq bad" "id:1,phase:1,deny,status:403"';
            content_by_lua_block {
                ngx.say("pass")
            }
        }
    }

    server {
        listen 127.0.0.1:8081;
        location / {
            return 200 "backend\n";
        }
    }
}

stream {
    lua_shared_dict stream_smoke 1m;

    upstream lua_stream {
        server 0.0.0.1:1;
        balancer_by_lua_block {
            ngx.ctx.peer = "8081"
            assert(require("ngx.balancer").set_current_peer("127.0.0.1", 8081))
        }
    }

    server {
        listen 9000;
        preread_by_lua_block {
            ngx.ctx.seen = true
        }
        proxy_pass lua_stream;
        log_by_lua_block {
            ngx.shared.stream_smoke:set("balancer", (ngx.ctx.peer or "none") .. " " .. ngx.config.subsystem .. " " .. tostring(ngx.ctx.seen))
        }
    }

    server {
        listen 9443;
        ssl_preread on;
        proxy_pass 127.0.0.1:8443;
        log_by_lua_block {
            ngx.shared.stream_smoke:set("sni", ngx.var.ssl_preread_server_name or "none")
        }
    }

    server {
        listen 9001;
        content_by_lua_block {
            local d = ngx.shared.stream_smoke
            ngx.say(d:get("balancer") or "nothing", ", ", d:get("sni") or "nothing")
        }
    }
}
