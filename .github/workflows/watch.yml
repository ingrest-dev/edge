name: watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=body.md bash tools/watch/nginx.sh >out.txt
          version=$(sed -n 's/^version=//p' out.txt)
          if [ -z "$version" ]; then
            echo "nginx $(sed 's/\.[0-9]*$//' VERSION) is the latest mainline"
            exit 0
          fi
          branch="nginx-$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch exists"
            exit 0
          fi
          label=()
          if grep -qx 'security=true' out.txt; then
            gh label create security --color B60205 --description "Panels with automatic security updates install it at once" 2>/dev/null || true
            label=(--label security)
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          echo "$version.1" >VERSION
          git commit -am "build(nginx): $version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "build(nginx): $version" "${label[@]}" --body-file body.md
          gh workflow run build.yml --ref "$branch"

  modules:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODIES=bodies bash tools/watch/modules.sh >updates.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r name tags security edits; do
            branch="modules-$name-$(printf '%s' "$edits" | sha256sum | cut -c1-8)"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "branch $branch exists"
              continue
            fi
            label=()
            if [ "$security" = true ]; then
              gh label create security --color B60205 --description "Panels with automatic security updates install it at once" 2>/dev/null || true
              label=(--label security)
            fi
            {
              echo "Moves $tags. The smoke test checks the module stack together."
              echo
              cat "bodies/$name.md"
              if [ "$security" = true ]; then
                echo
                echo "Commit subjects matched security words: check them and drop the label if they are not security fixes."
              fi
            } >body.md
            git switch -q main
            git switch -c "$branch"
            sed -i "$edits" Dockerfile
            git commit -am "build($name): $tags"
            git push origin "$branch"
            gh pr create --base main --head "$branch" --title "build($name): $tags" "${label[@]}" --body-file body.md
            gh workflow run build.yml --ref "$branch"
          done <updates.tsv
