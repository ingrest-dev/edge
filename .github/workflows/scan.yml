name: scan

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/watch/scan.sh >body.md
          if [ ! -s body.md ]; then
            echo "no fixable HIGH or CRITICAL vulnerabilities in the published image"
            exit 0
          fi
          cat body.md >>"$GITHUB_STEP_SUMMARY"
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("refresh-"))] | length')
          if [ "$open" != 0 ]; then
            echo "a refresh pull request is open"
            exit 0
          fi
          seen=$(gh pr list --state all --limit 50 --json headRefName,body,createdAt | jq --rawfile b body.md 'def norm: gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" "); [.[] | select((.headRefName | startswith("refresh-")) and (.createdAt | fromdateiso8601) > (now - 7 * 86400) and ((.body | norm) == ($b | norm)))] | length')
          if [ "$seen" != 0 ]; then
            echo "a refresh pull request covered these findings this week"
            exit 0
          fi
          branch="refresh-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          date -u +%Y-%m-%dT%H:%M:%SZ >REFRESH
          git commit -am "build(debian): refresh packages"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "build(debian): refresh packages" --label security --body-file body.md
          gh workflow run build.yml --ref "$branch"

  unfixed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/watch/unfixed.sh >body.md
          title="Unfixed vulnerabilities in linked libraries"
          num=$(gh issue list --state open --label security --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ ! -s body.md ]; then
            echo "no unfixed HIGH or CRITICAL vulnerabilities in linked libraries"
            if [ -n "$num" ]; then gh issue close "$num" --comment "No findings in the latest scan."; fi
            exit 0
          fi
          cat body.md >>"$GITHUB_STEP_SUMMARY"
          gh label create security --color B60205 --description "Panels with automatic security updates install it at once" 2>/dev/null || true
          if [ -z "$num" ]; then
            gh issue create --title "$title" --label security --body-file body.md
          elif [ "$(gh issue view "$num" --json body --jq .body)" != "$(cat body.md)" ]; then
            gh issue edit "$num" --body-file body.md
            gh issue comment "$num" --body "Findings changed: the description lists the current scan."
          fi
