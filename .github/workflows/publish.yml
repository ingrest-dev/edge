name: publish

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish

env:
  IMAGE: ghcr.io/ingrest-dev/edge

jobs:
  route:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      environment: ${{ steps.route.outputs.environment }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          env=release
          files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '[.files[].filename] | join(" ")')
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .user.login == "github-actions[bot]" and (.head.ref | startswith("nginx-")))] | length')
          if [ "$files" = VERSION ] && [ "$pr" = 1 ]; then
            env=release-auto
          fi
          echo "commit changes '$files', bot nginx pull requests: $pr, environment $env"
          echo "environment=$env" >>"$GITHUB_OUTPUT"

  publish:
    needs: route
    runs-on: ubuntu-24.04
    environment: ${{ needs.route.outputs.environment }}
    permissions:
      contents: write
      packages: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-digest
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EDGE_KEY: ${{ secrets.EDGE_KEY }}
        run: |
          version=$(cat VERSION)
          min_panel=$(cat MIN_PANEL)
          short=$(echo "$SHA" | cut -c1-7)
          digest=$(cat release/digest)
          case "$digest" in sha256:*) ;; *) echo "no digest from build run"; exit 1 ;; esac
          tagged=$(docker buildx imagetools inspect "$IMAGE:$version-$short" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$tagged" = "$digest" ] || { echo "$IMAGE:$version-$short is $tagged, the build made $digest"; exit 1; }
          security=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[].labels[].name] | index("security") != null')
          gh release view channels >/dev/null 2>&1 || gh release create channels --title channels --notes "Signed manifests of edge images" --latest=false
          assets=$(gh release view channels --json assets --jq '[.assets[].name] | join(" ")')
          case " $assets " in
          *" stable.json "*)
            gh release download channels -p stable.json -O old.json
            gh release download channels -p stable.json.minisig -O old.json.minisig
            minisign -V -p keys/edge.pub -m old.json -x old.json.minisig
            ;;
          *) echo '{"channel":"stable","images":[]}' >old.json ;;
          esac
          jq --arg v "$version" --arg img "$IMAGE@$digest" --arg min "$min_panel" --argjson sec "$security" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{channel: "stable", images: ([{version: $v, image: $img, min_panel: $min, security: $sec, published_at: $at}] + [.images[] | select(.image != $img)])[:20]}' \
            old.json >stable.json
          umask 077
          printf '%s\n' "$EDGE_KEY" >edge.key
          minisign -S -s edge.key -m stable.json -t "file:stable.json version:$version"
          rm edge.key
          minisign -V -p keys/edge.pub -m stable.json
          gh release upload channels stable.json stable.json.minisig --clobber
          cat stable.json >>"$GITHUB_STEP_SUMMARY"
