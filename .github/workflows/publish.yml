name: publish

on:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ingrest-dev/edge

jobs:
  route:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      environment: ${{ steps.route.outputs.environment }}
      prev: ${{ steps.route.outputs.prev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: keys
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          env=release
          prev=
          change=none
          pr=0
          if gh release download channels -R "$GITHUB_REPOSITORY" -p stable.json -p stable.json.minisig 2>/dev/null \
            && minisign -V -q -p keys/edge.pub -m stable.json -x stable.json.minisig; then
            prev=$(jq -r '[.images[] | select(.commit != null)] | sort_by(.published_at) | last | .commit // empty' stable.json || true)
          fi
          if [[ "$prev" =~ ^[0-9a-f]{40}$ ]]; then
            change=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$SHA" --jq '.status + " " + ([.files[].filename] | join(" "))') || change=error
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\" and .user.login == \"github-actions[bot]\" and (.head.ref | startswith(\"nginx-\")))] | length") || pr=0
          else
            prev=
          fi
          if [ "$change" = "ahead VERSION" ] && [ "$pr" = 1 ] && [ "$EVENT" = workflow_dispatch ] && [ "$ACTOR" = "github-actions[bot]" ]; then
            env=release-auto
          fi
          echo "last published commit '${prev:-unknown}', change since: $change, bot nginx pull requests: $pr, $EVENT by $ACTOR: environment $env"
          echo "environment=$env" >>"$GITHUB_OUTPUT"
          echo "prev=$prev" >>"$GITHUB_OUTPUT"

  approve:
    needs: route
    if: needs.route.outputs.environment == 'release'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: echo "approved"

  publish:
    needs: [route, approve]
    if: ${{ always() && needs.route.result == 'success' && (needs.approve.result == 'success' || (needs.approve.result == 'skipped' && needs.route.outputs.environment == 'release-auto')) }}
    runs-on: ubuntu-24.04
    environment: channel
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-digest
          path: release
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EDGE_KEY: ${{ secrets.EDGE_KEY }}
          PREV: ${{ needs.route.outputs.prev }}
          APPROVE: ${{ needs.approve.result }}
        run: |
          version=$(cat VERSION)
          min_panel=$(cat MIN_PANEL)
          short=$(echo "$SHA" | cut -c1-7)
          digest=$(cat release/digest)
          case "$digest" in sha256:*) ;; *) echo "no digest from build run"; exit 1 ;; esac
          tagged=$(docker buildx imagetools inspect "$IMAGE:$version-$short" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$tagged" = "$digest" ] || { echo "$IMAGE:$version-$short is $tagged, the build made $digest"; exit 1; }
          security=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[].labels[].name] | index("security") != null')
          if gh release view channels >/dev/null 2>&1; then
            gh release download channels -p stable.json -O old.json
            gh release download channels -p stable.json.minisig -O old.json.minisig
            minisign -V -p keys/edge.pub -m old.json -x old.json.minisig
          else
            gh release create channels --title channels --notes "Signed manifests of edge images" --latest=false
            echo '{"channel":"stable","images":[]}' >old.json
          fi
          newest=$(jq -r '[.images[] | select(.commit != null)] | sort_by(.published_at) | last | .commit // empty' old.json)
          if [ "$newest" = "$SHA" ] && jq -e --arg img "$IMAGE@$digest" '.images | any(.image == $img)' old.json >/dev/null; then
            echo "$SHA is already published as $IMAGE@$digest"
            exit 0
          fi
          if [ -n "$newest" ]; then
            order=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$newest" --jq .status)
            case "$order" in
            behind | diverged | identical) ;;
            *) echo "the published $newest is $order of $SHA: not publishing an older build"; exit 1 ;;
            esac
          fi
          other=$(jq -r --arg v "$version" --arg img "$IMAGE@$digest" '[.images[] | select(.version == $v and .image != $img)] | first | .image // empty' old.json)
          [ -z "$other" ] || { echo "version $version is already published as $other: bump the build number in VERSION"; exit 1; }
          if [ "$APPROVE" = skipped ] && [ "$newest" != "$PREV" ]; then
            echo "the channel moved from $PREV to $newest since the route check"
            exit 1
          fi
          jq --arg v "$version" --arg img "$IMAGE@$digest" --arg min "$min_panel" --argjson sec "$security" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg commit "$SHA" \
            'any(.images[]; .image == $img and .security == true) as $was | {channel: "stable", images: ([{version: $v, image: $img, min_panel: $min, security: ($sec or $was), published_at: $at, commit: $commit}] + [.images[] | select(.image != $img)])[:20]}' \
            old.json >stable.json
          umask 077
          printf '%s\n' "$EDGE_KEY" >edge.key
          minisign -S -s edge.key -m stable.json -t "file:stable.json version:$version"
          rm edge.key
          minisign -V -p keys/edge.pub -m stable.json
          check() {
            for i in 1 2 3 4 5 6; do
              rm -f check.json check.json.minisig
              if gh release download channels -p stable.json -O check.json 2>/dev/null &&
                gh release download channels -p stable.json.minisig -O check.json.minisig 2>/dev/null &&
                minisign -V -q -p keys/edge.pub -m check.json -x check.json.minisig && cmp -s "$1" check.json; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          intact() {
            rm -f check.json check.json.minisig
            gh release download channels -p stable.json -O check.json 2>/dev/null &&
              gh release download channels -p stable.json.minisig -O check.json.minisig 2>/dev/null &&
              minisign -V -q -p keys/edge.pub -m check.json -x check.json.minisig
          }
          mkdir -p previous
          if [ -f old.json.minisig ]; then
            cp old.json previous/stable.json.prev
            cp old.json.minisig previous/stable.json.prev.minisig
            gh release upload channels previous/stable.json.prev previous/stable.json.prev.minisig --clobber
          fi
          if gh release upload channels stable.json stable.json.minisig --clobber && check stable.json; then
            cat stable.json >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "the new manifest did not land"
          if intact; then
            echo "the release still holds a valid manifest"
          elif [ -f previous/stable.json.prev ]; then
            mkdir -p restore
            cp previous/stable.json.prev restore/stable.json
            cp previous/stable.json.prev.minisig restore/stable.json.minisig
            gh release upload channels restore/stable.json restore/stable.json.minisig --clobber && check restore/stable.json \
              || echo "restore failed: the release keeps the last good pair as stable.json.prev and stable.json.prev.minisig, rename them back"
          fi
          exit 1

  lost:
    needs: publish
    if: always() && needs.publish.result == 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "publish was cancelled, possibly by a newer publish in the queue: re-run the failed jobs of this build run if the image should still be published"
          exit 1
